<div *ngIf="loading" class="flex-center" style="margin-top:2rem;">Loading dashboard...</div>
<section *ngIf="!loading">
  <h2 style="color: var(--primary);margin-bottom:1.2em;">My Organized Events</h2>
  <div class="event-grid">
    <div class="event-card" *ngFor="let event of myEvents">
      <a [routerLink]="['/edit', event.id]" title="Edit this event">
        <div class="cover" [style.backgroundImage]="'url(' + (event.coverImageUrl || 'https://placehold.co/300x190?text=Event') + ')'"></div>
        <div class="content">
          <span class="title">{{ event.title }}</span>
          <span class="subtitle">{{ event.location }} &middot; {{ event.startTime | date:'short' }}</span>
        </div>
      </a>
    </div>
  </div>
  <div *ngIf="myEvents.length===0" class="flex-center" style="margin-top:2rem;color:#888;">No events yet.</div>
</section>
